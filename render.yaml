services:
  - type: web
    name: error-x-hosting
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: HOSTING_NAME
        value: ERROR X HOSTING
      - key: SECRET_KEY
        generateValue: true
